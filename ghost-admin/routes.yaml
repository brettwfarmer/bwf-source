# BWF routes.yaml - reference copy (applied in Ghost Admin > Settings > Labs > Routes)
#
# DESIGN CONSTRAINT (locked): series pages are CHANNEL routes, never collections.
# Channels are additive views; they do not re-home posts, so every existing flat
# permalink (brettwfarmer.com/{slug}/) keeps working. Converting any of these to a
# collection is a breaking change and is prohibited.
#
# The `collections: /` block at the bottom is Ghost's DEFAULT root collection and
# is what keeps article URLs flat. It is required. It is not the prohibited
# pattern; do not remove it.
#
# ---------------------------------------------------------------------------
# VERIFY BEFORE APPLYING
# ---------------------------------------------------------------------------
# Each entry below has TWO independent values. Do not conflate them:
#
#   1. ROUTE PATH  (the `/xxx/:` key) - the public URL. Brett's choice; arbitrary.
#      It does NOT have to equal the tag slug. Changing it changes the series URL.
#   2. TAG SLUG    (the `tag:xxx` in `filter`) - MUST match the tag's actual slug
#      in Ghost exactly. This is the value that is UNVERIFIED.
#
# They are currently identical for all six entries, which is clean but incidental.
# If a real slug differs, prefer correcting the FILTER and leaving the route path
# alone - the path is a published URL choice, the slug is ground truth.
#
# WHY THIS MATTERS: a wrong tag slug does not 404. It fails silently.
#   - Wrong slug in routes.yaml  -> the channel renders as an EMPTY post list.
#   - Wrong slug in series-nav   -> `{{#get}}` returns nothing, the gate is false,
#                                   and the arc card silently never renders.
#
# SAME VALUES LIVE IN THE THEME. `partials/components/series-nav.hbs` hardcodes
# all six route paths (as `href`) and the two arc tag slugs (in `{{#get}}`
# filters). Any correction here MUST be mirrored there in the same change, or the
# card links and the routes will disagree.
#
# Ground truth source: Ghost Admin > Tags (or /ghost/api/content/tags/ with a key).
# Watch for: internal tags (slug prefixed `hash-`), and slugs Ghost auto-generated
# with a numeric suffix (`-2`) from an earlier duplicate tag name.

routes:
  /operational-learning/:                 # VERIFIED 2026-08-30 via Content API (10 posts)
    controller: channel
    filter: tag:operational-learning
    template: index
  /data-done-right/:                      # VERIFIED 2026-08-30 via Content API (7 posts)
    controller: channel
    filter: tag:data-done-right
    template: index
  /across-the-divide/:                    # VERIFIED 2026-08-30 via Content API (10 posts)
    controller: channel
    filter: tag:across-the-divide
    template: index
  /real-talk-to-real-results/:            # VERIFIED 2026-08-30 via Content API (5 posts)
    controller: channel
    filter: tag:real-talk-to-real-results
    template: index
  # DISABLED 2026-08-30: tag `architecture-that-persuades` does not exist in Ghost.
  # An active route here would publish a live URL rendering an EMPTY post list.
  # To enable: create the tag, tag >= 3 published posts into it (the series-nav
  # card is gated on the same threshold), then uncomment the four lines below.
  # /architecture-that-persuades/:          # Arc 1 - enable once tag exists (see note above)
  #   controller: channel
  #   filter: tag:architecture-that-persuades
  #   template: index
  # DISABLED 2026-08-30: tag `who-pays-for-clarity` does not exist in Ghost.
  # An active route here would publish a live URL rendering an EMPTY post list.
  # To enable: create the tag, tag >= 3 published posts into it (the series-nav
  # card is gated on the same threshold), then uncomment the four lines below.
  # /who-pays-for-clarity/:                 # Arc 2 - enable once tag exists (see note above)
  #   controller: channel
  #   filter: tag:who-pays-for-clarity
  #   template: index

collections:
  /:
    permalink: /{slug}/
    template: index

taxonomies:
  tag: /tag/{slug}/
  author: /author/{slug}/
