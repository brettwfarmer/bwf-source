<!--
  BWF Code Injection - HEAD (Ghost Admin > Settings > Code injection > Site header)
  Version: v1.2 (2026-08-30). Reference copy of record; applied by hand.

  SCOPE: brand fonts, token system, and the v1.2 typographic scale.
    - P0 section makes the v1.1 design actually render (tokens + fonts).
    - P1 sections add the reading scale v1.1 never specified, and bring the
      conversion surfaces onto the token system.
  The OG card template is NOT here; it lives in ghost-admin/og-template/ and
  produces images uploaded per post as feature images.

  REPLACES the Solo-era injection entirely. That block must be deleted, not
  appended to. It contains three things that must not survive:
    1. The legacy JS series-nav (`sn.className = "bwf-series-nav"`). The theme now
       renders this server-side. Leaving both produces TWO "Explore the Series"
       rows on the homepage.
    2. The retired teal on the Across the Divide cards (border, hover, title).
       Across the Divide's ratified accent is bronze, below.
    3. Pure-white values, which the brand system prohibits.

  ORDERING NOTE: Ghost emits code injection inside {{ghost_head}}, which is the
  last tag in <head>, so these :root declarations land after Ghost's own font
  variables. The doubled `:root:root` selector on the font block is a deliberate
  specificity guard - Newsreader silently failed to load once already, and the
  font hooks are the one thing here that Ghost also writes.

  PROVENANCE: regenerated from the brand system token table. A fuller injection
  package was produced 2026-06-01 (soft anchors, footnote/source cards,
  component-level styling).

  SEARCHED 2026-08-30 - that file does not exist on this machine. Downloads,
  Desktop and Documents were swept for its distinctive content and the only hits
  were these provenance notes. Treat it as lost, not misplaced; do not go looking
  again. The long-form structural devices it carried are fully specified in
  brand system section 4.4 and can be rebuilt from the document. They are NOT
  implemented here yet - this block covers tokens, fonts, the type scale, and
  conversion surfaces only.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&display=swap" rel="stylesheet">

<style>
:root {
  /* Brand System v1.1 - nine-token core */
  --color-bg: #040A1C;
  --color-surface: #0D1220;
  --color-text-primary: #E8E6E0;
  --color-text-secondary: #B0ADA6;
  --color-text-muted: #8A8880;
  --color-accent-primary: #7EB3CC;   /* steel  - links, interactive, Data Done Right */
  --color-accent-secondary: #D4943A; /* amber  - Operational Learning, Real Talk to Real Results */
  --color-accent-tertiary: #A86A28;  /* bronze - Across the Divide */
  --color-border: #4A4D52;

  /* Extended palette - supporting values only, never primary accents */
  --color-steel-deep: #5A8FA8;
  --color-steel-light: #A3CFDE;
  --color-steel-highlight: #D1E8F0;
  --color-amber-deep: #8B6420;
  --color-amber-light: #E8B86A;
  --color-amber-highlight: #F4D9A8;
  --color-surface-elevated: #141A2E;
  --color-structure: #2A2E36;

  /* Map brand tokens onto Source's own custom properties */
  --background-color: var(--color-bg);
  --color-darker-gray: var(--color-text-primary);
}

/* Font hooks. Doubled selector is a specificity guard against Ghost's own
   --gh-font-* declaration, which is generated from the theme's title_font /
   body_font settings and cannot offer Newsreader. */
:root:root {
  --gh-font-heading: 'Newsreader', Georgia, 'Times New Roman', serif;
  --gh-font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

body {
  background-color: var(--color-bg);
  color: var(--color-text-primary);
}

a { color: var(--color-accent-primary); }

/* ----------------------------------------------------------------------
   v1.2 TYPOGRAPHIC SCALE (P1)

   v1.1 named two fonts and stopped. It defined no size, measure or leading,
   which is the actual reading-comfort gap. Everything below drives Source's
   own custom properties, so none of it requires a theme release.

   Source runs html { font-size: 62.5% }, so 1rem = 10px throughout.
   The two hooks that matter are --content-font-size (default 1.7rem) and
   --content-width (default 720px); both are read by Source's own CSS.
   ---------------------------------------------------------------------- */
:root {
  /* 19px body. Source itself steps up to 1.9rem for serif titles, so this is
     its own sanctioned reading size rather than an invention. DM Sans has a
     small x-height; 17px on a dark ground reads thin. */
  --content-font-size: 1.9rem;

  /* Measure. 720px at 19px DM Sans runs about 77 characters, past the
     comfortable ceiling. 680px lands near 72. */
  --content-width: 680px;
}

/* Body copy. Light text on a dark ground blooms optically, so it wants more
   leading than the same setting would on white, and no negative tracking. */
.gh-content {
  line-height: 1.65;
  letter-spacing: 0;
}
.gh-content > p { margin-block-end: 1.5em; }

/* Headings set in Newsreader. Tighter leading and slight negative tracking:
   a serif at display size needs both, and Source's default assumes a sans. */
.gh-article-title,
.gh-content h1, .gh-content h2, .gh-content h3,
.gh-content h4, .gh-content h5, .gh-content h6 {
  font-family: var(--gh-font-heading);
  line-height: 1.18;
  letter-spacing: -0.015em;
}
.gh-article-title { line-height: 1.1; letter-spacing: -0.02em; }

/* In-content heading steps, roughly a 1.25 ratio off the 19px base. */
.gh-content h2 { font-size: 3.0rem; margin-block-start: 1.6em; }
.gh-content h3 { font-size: 2.4rem; margin-block-start: 1.4em; }
.gh-content h4 { font-size: 2.0rem; margin-block-start: 1.2em; }

/* Excerpt and lede sit between heading and body. */
.gh-article-excerpt { font-size: 2.1rem; line-height: 1.5; color: var(--color-text-secondary); }

@media (max-width: 767px) {
  :root { --content-font-size: 1.8rem; }
  .gh-content h2 { font-size: 2.6rem; }
  .gh-content h3 { font-size: 2.2rem; }
}

/* ----------------------------------------------------------------------
   v1.2 CONVERSION SURFACES (P1)

   PORTAL SCOPE, read this before trying to style it: Ghost Portal renders
   into an iframe that portal.min.js injects at runtime. Nothing in this
   block reaches inside it, and no amount of CSS here will. Portal's only
   real lever is the accent color (Ghost Admin > Design), already steel
   #7EB3CC and on-brand. Portal copy is set in Admin > Portal settings.
   Everything below styles the THEME's own conversion surfaces, which is
   where the reader actually is before Portal ever opens.
   ---------------------------------------------------------------------- */

/* Subscribe button. Source sets `color: var(--color-white)` over the accent
   background. Pure white on steel measures 2.28:1 - under the 4.5:1 WCAG AA
   floor the brand system sets as its accessibility minimum, and a pure-white
   violation besides. Dark-on-steel measures 8.64:1.
   Worth noting the fix has to INVERT rather than substitute: the brand's own
   light text token #E8E6E0 is worse still at 1.83:1. */
.gh-button {
  color: var(--color-bg);
  font-family: var(--gh-font-body);
  letter-spacing: 0;
}
.gh-button:hover { background-color: var(--color-steel-light); }

/* Form shell. Source's default is a flat translucent white wash; give it a
   real surface and an explicit border so the field reads as an affordance. */
.gh-form {
  background-color: var(--color-surface-elevated);
  border: 1px solid var(--color-border);
}
.gh-form-input { color: var(--color-text-primary); }
.gh-form-input::placeholder { color: var(--color-text-muted); opacity: 1; }

/* Focus. Source sets `outline: none` on .gh-form-input and never replaces it
   anywhere in the stylesheet, so a keyboard user gets no visible focus on the
   primary conversion element (WCAG 2.4.7). The ring goes on the shell because
   the input is absolutely positioned to fill it. */
.gh-form:focus-within {
  outline: 2px solid var(--color-accent-primary);
  outline-offset: 2px;
}

/* CTA and footer signup blocks. */
.gh-cta-inner {
  background-color: var(--color-surface);
  border: 1px solid var(--color-border);
}
.gh-cta-title,
.gh-footer-signup-header {
  font-family: var(--gh-font-heading);
  line-height: 1.18;
  letter-spacing: -0.015em;
}
.gh-cta-description,
.gh-footer-signup-subhead {
  color: var(--color-text-secondary);
}

/* ----------------------------------------------------------------------
   v1.2 LONG-FORM STRUCTURAL DEVICES (brand system section 4.4)

   Section 4.4 specifies seven devices. Their markup was inventoried across
   all 74 published posts on 2026-08-31 before any selector here was written,
   because three of the seven have never once been used and styling them
   blind would have been guesswork:

     pull quotes        76 blockquotes across 38 posts   HEAVILY USED
     Sources section    20 posts                          USED
     principle callouts  1 post (kg-callout-card)         BARELY USED
     comparison tables   0                                NEVER USED
     code blocks         0                                NEVER USED
     footnotes           0                                NEVER USED
     soft anchors        no markup exists                 NOT IMPLEMENTED

   The unused four are still styled, cheaply and to spec, so the first one
   authored renders correctly rather than raw. Soft anchors are absent
   because they need an authoring convention decided first - see the note at
   the end of this block.

   Root is 62.5%, so 1rem = 10px and the document's px sizes map directly.
   ---------------------------------------------------------------------- */

/* Pull quotes. 4.4: Newsreader Regular 24px, italic, text-primary, 4px left
   border in accent-primary, indented 24px. This supersedes the blockquote
   rule from the type-scale pass, which used a 3px border, secondary text and
   upright roman - four deviations from the document, all now corrected. */
.gh-content blockquote {
  font-family: var(--gh-font-heading);
  font-weight: 400;
  font-style: italic;
  font-size: 2.4rem;
  line-height: 1.4;
  color: var(--color-text-primary);
  border-left: 4px solid var(--color-accent-primary);
  padding-left: 24px;
  margin-left: 24px;
}

/* Scene separators. NOT in section 4.4 - but <hr> is the most-used structural
   element in the archive by a wide margin (257 occurrences across 68 of 74
   posts, 92%), and the document does not mention it at all. Left unstyled it
   renders as the browser default rule. Flagged for the document. */
.gh-content hr {
  border: 0;
  border-top: 1px solid var(--color-border);
  margin-block: 2.4em;
}

/* Sources section. 4.4: heading SOURCES in DM Sans Medium 12px all-caps,
   text-muted, 1px top border; list in DM Sans Regular 14px, text-secondary,
   hanging indent. Ghost auto-generates heading IDs, so this needs no special
   authoring - a heading with the text "Sources" already carries id="sources".
   Each source is its own <p>, and Sources is always the last section, so the
   general sibling combinator is safe here. */
.gh-content [id="sources"] {
  font-family: var(--gh-font-body);
  font-weight: 500;
  font-size: 1.2rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-text-muted);
  border-top: 1px solid var(--color-border);
  padding-top: 1.6em;
  margin-block-start: 2.4em;
}
/* Authors usually place an <hr> immediately before the heading; without this
   the rule and the border stack into a visible double line. */
.gh-content hr + [id="sources"] { border-top: 0; padding-top: 0; margin-block-start: 0; }
.gh-content [id="sources"] ~ p {
  font-family: var(--gh-font-body);
  font-size: 1.4rem;
  line-height: 1.5;
  color: var(--color-text-secondary);
  padding-left: 2.4em;
  text-indent: -2.4em;      /* hanging indent */
  margin-block-end: 0.8em;
}

/* Principle callouts. 4.4 asks for a bordered box carrying the literal word
   PRINCIPLE above the text. Ghost has no principle card, so this maps onto
   the accent variant of its callout card: an accent callout IS a principle
   callout. That is an authoring convention, not something Ghost enforces -
   see the note at the end of this block. */
.gh-content .kg-callout-card {
  background-color: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: 0;
  padding: 24px;
}
.gh-content .kg-callout-text {
  font-family: var(--gh-font-body);
  font-weight: 500;
  font-size: 1.7rem;
  line-height: 1.5;
  color: var(--color-text-primary);
}
.gh-content .kg-callout-card-accent::before {
  content: "PRINCIPLE";
  display: block;
  font-family: var(--gh-font-body);
  font-weight: 500;
  font-size: 1.2rem;
  letter-spacing: 0.08em;
  color: var(--color-text-muted);
  margin-bottom: 10px;
}

/* Comparison tables. 4.4: surface header row with secondary text, body rows
   alternating bg and surface, 1px borders throughout, 15px DM Sans. */
.gh-content table {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--gh-font-body);
  font-size: 1.5rem;
}
.gh-content table th,
.gh-content table td { border: 1px solid var(--color-border); padding: 12px 14px; text-align: left; }
.gh-content table th {
  font-weight: 500;
  background-color: var(--color-surface);
  color: var(--color-text-secondary);
}
.gh-content table tbody tr:nth-child(odd)  { background-color: var(--color-bg); }
.gh-content table tbody tr:nth-child(even) { background-color: var(--color-surface); }

/* Code blocks. 4.4: surface background, system mono stack, 14px,
   text-primary, 16px padding, no border. */
.gh-content pre {
  background-color: var(--color-surface);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 1.4rem;
  line-height: 1.55;
  color: var(--color-text-primary);
  padding: 16px;
  border: 0;
  border-radius: 0;
  overflow-x: auto;
}
.gh-content :not(pre) > code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.92em;
  background-color: var(--color-surface);
  padding: 0.15em 0.4em;
}

/* Footnotes. 4.4: 13px DM Sans, text-muted, with the marker as a superscript
   link in accent-primary. Ghost's markdown card emits sup#fnref:n and a
   div.footnotes, so both shapes are covered. */
.gh-content sup a,
.gh-content a[id^="fnref"] { color: var(--color-accent-primary); text-decoration: none; }
.gh-content .footnotes {
  font-family: var(--gh-font-body);
  font-size: 1.3rem;
  line-height: 1.5;
  color: var(--color-text-muted);
  border-top: 1px solid var(--color-border);
  padding-top: 1.2em;
  margin-block-start: 2.4em;
}

/* In use but unspecified by 4.4: toggle cards (14 posts) and bookmark cards
   (12). Minimal token alignment only, so they stop rendering on Source's
   light-theme defaults. */
.gh-content .kg-toggle-card,
.gh-content .kg-bookmark-container {
  background-color: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: 0;
  color: var(--color-text-primary);
}
.gh-content .kg-bookmark-description,
.gh-content .kg-bookmark-metadata { color: var(--color-text-secondary); }

/* NOT IMPLEMENTED - soft anchors. 4.4 specifies DM Sans Medium 18-20px in
   accent-secondary, replacing formal H2/H3 in chapter-flow articles. There is
   no markup for them: Ghost has no such element, and h4 cannot be repurposed
   because the archive already uses it for short list labels ("See it.",
   "Own it.", "Trust"). Implementing them requires choosing an authoring
   convention first. Left out deliberately rather than guessed at. */
</style>
